<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap File : include cdn links</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center">
  <div class="border border-2 border-danger p-3 w-25">
    <div class="mb-1 p-3 rounded rounded-2">
      <label for="userName" class="form-label">User Name</label>
      <input type="text" placeholder="Enter your user name..." id="userName" class="form-control border border-1 border-info">
    </div>
    <div class="mb-1 p-3 rounded rounded-2">
      <label for="userName" class="form-label">Password</label>
      <input type="text" placeholder="Enter your password..." id="userName" class="form-control border border-1 border-info">
    </div>
    <div class="mb-1 p-3 rounded rounded-2">
      <label for="userName" class="form-label">Email</label>
      <input type="text" placeholder="Enter your email..." id="userName" class="form-control border border-1 border-info">
    </div>
    <div class="mb-1 p-3 rounded rounded-2">
      <label for="userName" class="form-label">Contact</label>
      <input type="text" placeholder="Enter your contact..." id="userName" class="form-control border border-1 border-info">
    </div>
    <div class="mb-1 p-3 rounded rounded-2">
      <label for="address" class="form-label">Address</label>
      <textarea rows="3" placeholder="Enter your address..." class="form-control border border-1 border-info"></textarea>
    </div>
    <div class="mb-1 p-3 rounded rounded-2">
     <button type="submit" class="btn btn-success w-100">Submit</button>
    </div>
  </div>
</body>
</html>
