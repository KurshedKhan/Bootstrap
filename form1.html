<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap File : include cdn links</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .border-every{
      border: 2px solid green;
    }
  </style>
</head>
<body>
  <!-- <input type="text" placeholder="Enter your name...">
  <input type="text" value="Enter your name..."> -->
  
  <input type="text" class="form-control border-every" disabled placeholder="Enter your name...">
  <input type="text" class="form-control border-every" disabled readonly value="Enter your name...">

  <input type="file" class="form-control border-every">

  <p class="h3">Language</p>
  <select class="form-select">
    <option selected value="Selected" disabled>Selected</option>
    <option value="Math">Math</option>
    <option value="Science">Science</option>
    <option value="Hindi">Hindi</option>
    <option value="English">English</option>
  </select>


  <div class="form-check">
    <input class="form-check-input" checked type="checkbox" value="" id="flexCheckIndeterminate">
    <label class="form-check-label" for="flexCheckIndeterminate">
      Indeterminate checkbox
    </label>
  </div>

  <div class="d-flex justify-content-between w-25">
    <div class="form-check">
      <label for="">Male</label>
      <input type="radio" class="form-check-input border-every" name="gender"> 
    </div>
    <div class="form-check">
      <label for="">Female</label>
      <input type="radio" class="form-check-input border-every" name="gender">
    </div>
    <div class="form-check">
      <label for="">Other</label>
      <input type="radio" class="form-check-input border-every" name="gender">
    </div>
  </div>

  <div class="form-check form-switch">
    <input type="checkbox" class="form-check-input" role="switch">
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
